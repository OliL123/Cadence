<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <!-- browser/status-bar tint; deploy_chronicle.sh swaps it for Chronicle's -->
  <meta name="theme-color" content="#BE3A2B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cadence">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cadence 節奏</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Identity Services (for read-only Google Calendar sign-in) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Auto-update: the deploy script stamps a build id here + into build.txt.
       We poll build.txt and, when it changes, reload with a cache-busting query
       so a new deploy is picked up without a manual hard refresh. -->
  <script>window.__CADENCE_BUILD__ = "__BUILD_ID__";</script>
  <script>
    // A new deploy is offered, not forced: reloading by itself could throw
    // away something half-typed. While the page is in use a small bar offers
    // the update; after 30+ minutes away it updates itself on return.
    (function () {
      var B = window.__CADENCE_BUILD__;
      // Dev build: the deploy script hasn't stamped an id. (The marker is
      // split so that stamping, which replaces every copy of it, can't turn
      // this check into "is this build itself?" — which switched auto-update
      // off on every deployed build.)
      if (!B || B === "__BUILD" + "_ID__") return;
      var AWAY_MS = 30 * 60 * 1000;
      var pending = null, hiddenAt = null, bar = null, snoozed = null;
      function reload() { location.replace("?v=" + encodeURIComponent(pending)); }
      function offer() {
        if (bar || snoozed === pending) return; // "Later" holds off for this version
        bar = document.createElement("div");
        bar.setAttribute("role", "status");
        bar.style.cssText =
          "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;" +
          "display:flex;gap:12px;align-items:center;padding:9px 10px 9px 16px;" +
          "background:#1F6E4E;color:#F6EFDA;border-radius:10px;" +
          "font:600 14px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);";
        var text = document.createElement("span");
        text.textContent = "A new version is ready";
        var go = document.createElement("button");
        go.textContent = "Reload";
        go.style.cssText =
          "border:0;border-radius:7px;padding:6px 12px;cursor:pointer;" +
          "background:#D2982E;color:#2C271C;font:700 13px system-ui,sans-serif;";
        go.onclick = reload;
        var later = document.createElement("button");
        later.textContent = "Later";
        later.style.cssText =
          "border:0;background:none;color:#F6EFDA;cursor:pointer;font:600 13px system-ui,sans-serif;";
        later.onclick = function () { snoozed = pending; bar.remove(); bar = null; };
        bar.append(text, go, later);
        document.body.appendChild(bar);
      }
      async function check() {
        try {
          var r = await fetch("build.txt?ts=" + Date.now(), { cache: "no-store" });
          if (!r.ok) return;
          var v = (await r.text()).trim();
          if (!v || v === B) return;
          pending = v;
          if (!document.hidden) offer();
        } catch (e) {}
      }
      setInterval(check, 60000);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) { hiddenAt = Date.now(); snoozed = null; return; }
        var away = hiddenAt !== null && Date.now() - hiddenAt >= AWAY_MS;
        hiddenAt = null;
        if (pending && away) { reload(); return; }
        check();
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
